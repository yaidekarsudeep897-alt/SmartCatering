{% extends "base.html" %}{% block content %}<a href="{{ url_for('dashboard') }}">← Dashboard</a><div class="formpage"><span class="eyebrow">EVENT OWNER</span><h1>Create an event</h1><p class="muted">Add your event details, then invite guests and request catering.</p><form method="post" class="panel form"><div class="two"><label>Event name<input name="title" required placeholder="Wedding reception"></label><label>Event type<select name="event_type"><option>Wedding</option><option>Birthday</option><option>Engagement</option><option>Corporate</option><option>Family function</option><option>Other</option></select></label><label>Date<input type="date" name="event_date" required></label><label>Time<input type="time" name="event_time"></label><label>Venue<input name="venue" required></label><label>Budget (₹)<input type="number" name="budget" min="0" step=".01" value="0"></label></div><label>Notes<textarea name="notes"></textarea></label><button class="btn">Save event</button></form></div>{% endblock %}
