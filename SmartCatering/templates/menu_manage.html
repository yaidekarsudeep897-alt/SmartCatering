{% extends "base.html" %}{% block content %}<div class="dashhead"><div><span class="eyebrow">CATERER TOOLS</span><h1>Your menu</h1><p class="muted">Add dishes and per-person prices.</p></div></div><div class="two"><form method="post" class="panel form"><h2>Add menu item</h2><label>Dish name<input name="name" required></label><label>Category<select name="category"><option>Starter</option><option>Main Course</option><option>Rice</option><option>Dessert</option><option>Beverage</option><option>Package</option><option>Other</option></select></label><label>Price per person (₹)<input type="number" name="price" min="0" step=".01" required></label><label>Description<input name="description"></label><button class="btn">Add dish</button></form><section class="panel"><h2>Current menu</h2>{% for d in dishes %}<div class="listrow"><div><b>{{ d.name }}</b><small>{{ d.category }} · {{ d.description }}</small></div><b>₹{{ '%.2f'|format(d.price) }}</b></div>{% else %}<p class="muted">No dishes yet.</p>{% endfor %}</section></div>{% endblock %}
