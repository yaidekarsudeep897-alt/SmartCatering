{% extends "base.html" %}{% block content %}<div class="auth"><span class="eyebrow">JOIN SMARTCATERING</span><h1>Create your account</h1><p class="muted">Choose the role that best describes you.</p><form method="post" class="form"><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone"></label><label>Password<input name="password" type="password" minlength="6" required></label><label>Account type<select name="role" id="role"><option value="owner">Event owner</option><option value="caterer">Caterer</option><option value="worker">Part-time worker</option></select></label><div id="worker"><label>Skills<input name="skills" placeholder="Serving, kitchen help..."></label><label>Experience<input name="experience" placeholder="Beginner / 1 year"></label><label>Preferred area<input name="area" placeholder="Mangaluru"></label></div><button class="btn">Create account</button></form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div><script>let r=document.getElementById('role'),w=document.getElementById('worker');function sw(){w.style.display=r.value==='worker'?'grid':'none'}r.onchange=sw;sw()</script>{% endblock %}
